[package]
name = "lokakirim"
version = "1.0.0"
description = "LokaKirim - Chat & Transfer File Wi-Fi Lokal Terenkripsi E2EE"
authors = ["LokaKirim"]
edition = "2021"

[lib]
name = "lokakirim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
include_dir = "0.7"
mime_guess = "2"
p256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
aes-gcm = { version = "0.10", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

