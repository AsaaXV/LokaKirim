name: Build Android APK (Rust + Tauri v2)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Sumber
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instal Dependensi Frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Frontend Vite (untuk aset Rust tersemat)
        run: npm run build

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Siapkan Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_BIN=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$CMDLINE_BIN" ]; then
            echo "sdkmanager tidak ditemukan di $SDK_ROOT"
            exit 1
          fi
          yes | "$CMDLINE_BIN" --licenses >/dev/null || true
          SDK_LIST=$("$CMDLINE_BIN" --list 2>/dev/null | awk '{print $1}')
          NDK_DIR=$(find "$SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 -type d \( -name '27.*' -o -name '28.*' \) 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            NDK_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^ndk;2[78]\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "$NDK_PKG" ]; then
              NDK_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^ndk;[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            fi
            "$CMDLINE_BIN" --install "$NDK_PKG"
            NDK_DIR="$SDK_ROOT/ndk/${NDK_PKG#ndk;}"
          fi
          PLATFORM_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^platforms;android-[0-9]+$' | sort -V | tail -n 1)
          BUILD_TOOLS_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^build-tools;[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          "$CMDLINE_BIN" --install "platform-tools" "$PLATFORM_PKG" "$BUILD_TOOLS_PKG"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "SDK siap: ANDROID_HOME=$SDK_ROOT | NDK_HOME=$NDK_DIR | $PLATFORM_PKG | $BUILD_TOOLS_PKG"

      - name: Siapkan Toolchain Rust & Target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Siapkan Cargo.lock untuk Cache Rust
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache Kompilasi Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Inisialisasi Proyek Android Tauri v2
        run: npx tauri android init --ci

      - name: Patch AndroidManifest.xml (Cleartext LAN & Izin Wi-Fi)
        run: node scripts/patch-android-manifest.mjs

      - name: Build Debug APK ARM64 (Ringkas & Siap Pasang)
        run: |
          if ! npx tauri android build --apk --debug --split-per-abi --ci --target aarch64 > /tmp/tauri-debug-build.log 2>&1; then
            echo "=== 80 BARIS LOG BUILD (TANPA DUMP ENV) ==="
            grep -v "Io(BeforeSpawn" /tmp/tauri-debug-build.log | tail -n 80 || true
            echo "=== RINGKASAN ERROR INTI ==="
            grep -v "Io(BeforeSpawn" /tmp/tauri-debug-build.log | grep -iE -C 4 "FAILURE:|What went wrong:|Caused by:|npm error|Missing script|error(\[E[0-9]+\])?:|Execution failed for task|AAPT:" | tail -n 80 || true
            exit 1
          fi
          tail -n 30 /tmp/tauri-debug-build.log

      - name: Kumpulkan Debug APK
        run: |
          mkdir -p artifacts
          DEBUG_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*arm64*debug*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            DEBUG_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          fi
          cp "$DEBUG_APK" artifacts/LokaKirim-arm64-debug.apk
          ls -lh artifacts/

      - name: Build Release APK Ringkas per-ABI (ARM64 + ARMv7, Selalu Ditandatangani)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! npx tauri android build --apk --split-per-abi --ci --target aarch64 armv7 > /tmp/tauri-release-build.log 2>&1; then
            echo "=== 80 BARIS LOG RELEASE (TANPA DUMP ENV) ==="
            grep -v "Io(BeforeSpawn" /tmp/tauri-release-build.log | tail -n 80 || true
            echo "=== RINGKASAN ERROR RELEASE ==="
            grep -v "Io(BeforeSpawn" /tmp/tauri-release-build.log | grep -iE -C 4 "FAILURE:|What went wrong:|Caused by:|npm error|Missing script|error(\[E[0-9]+\])?:|Execution failed for task|AAPT:" | tail -n 80 || true
            exit 1
          fi
          tail -n 30 /tmp/tauri-release-build.log
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          KS_PATH="/tmp/lokakirim-release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Menandatangani Release APK menggunakan keystore dari GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KS_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "GitHub Secrets keystore belum diatur; membuat keystore release sementara via keytool."
            KS_PASS="LokaKirimRelease2026!"
            KS_ALIAS="lokakirim"
            KEY_PASS="LokaKirimRelease2026!"
            rm -f "$KS_PATH"
            keytool -genkeypair -noprompt \
              -keystore "$KS_PATH" \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=LokaKirim, OU=LAN, O=LokaKirim, L=Jakarta, ST=Jakarta, C=ID"
          fi

          sign_apk() {
            local src_apk="$1"
            local out_apk="$2"
            if [ -n "$src_apk" ] && [ -f "$src_apk" ]; then
              rm -f /tmp/lokakirim-aligned.apk
              "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$src_apk" /tmp/lokakirim-aligned.apk
              "$BUILD_TOOLS_DIR/apksigner" sign \
                --ks "$KS_PATH" \
                --ks-pass "pass:$KS_PASS" \
                --ks-key-alias "$KS_ALIAS" \
                --key-pass "pass:$KEY_PASS" \
                --out "$out_apk" \
                /tmp/lokakirim-aligned.apk
              rm -f /tmp/lokakirim-aligned.apk
            fi
          }

          ARM64_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f \( -name "*arm64*release*.apk" -o -name "*aarch64*release*.apk" \) | head -n 1)
          ARMV7_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f \( -name "*arm-release*.apk" -o -name "*armeabi*release*.apk" -o -name "*armv7*release*.apk" \) | head -n 1)

          sign_apk "$ARM64_APK" "artifacts/LokaKirim-arm64-release.apk"
          sign_apk "$ARMV7_APK" "artifacts/LokaKirim-armv7-release.apk"

          if [ ! -f "artifacts/LokaKirim-arm64-release.apk" ] && [ ! -f "artifacts/LokaKirim-armv7-release.apk" ]; then
            FALLBACK_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
            if [ -z "$FALLBACK_APK" ]; then
              echo "File Release APK tidak ditemukan di src-tauri/gen/android/app/build/outputs/apk"
              exit 1
            fi
            sign_apk "$FALLBACK_APK" "artifacts/LokaKirim-release.apk"
          fi

          rm -f "$KS_PATH"
          ls -lh artifacts/

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: LokaKirim-Android-APK
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Tentukan Tag Rilis Otomatis
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Terbitkan GitHub Release Otomatis dengan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: LokaKirim ${{ steps.release_meta.outputs.tag }}
          files: artifacts/*.apk
          generate_release_notes: true
          make_latest: true
