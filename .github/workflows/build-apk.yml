name: Build Android APK (Rust + Tauri v2)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Sumber
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instal Dependensi Frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Frontend Vite (untuk aset Rust tersemat)
        run: npm run build

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Siapkan Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_BIN=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$CMDLINE_BIN" ]; then
            echo "sdkmanager tidak ditemukan di $SDK_ROOT"
            exit 1
          fi
          yes | "$CMDLINE_BIN" --licenses >/dev/null || true
          SDK_LIST=$("$CMDLINE_BIN" --list 2>/dev/null | awk '{print $1}')
          NDK_DIR=$(find "$SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 -type d \( -name '27.*' -o -name '28.*' \) 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            NDK_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^ndk;2[78]\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "$NDK_PKG" ]; then
              NDK_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^ndk;[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            fi
            "$CMDLINE_BIN" --install "$NDK_PKG"
            NDK_DIR="$SDK_ROOT/ndk/${NDK_PKG#ndk;}"
          fi
          PLATFORM_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^platforms;android-[0-9]+$' | sort -V | tail -n 1)
          BUILD_TOOLS_PKG=$(printf '%s\n' "$SDK_LIST" | grep -E '^build-tools;[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          "$CMDLINE_BIN" --install "platform-tools" "$PLATFORM_PKG" "$BUILD_TOOLS_PKG"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "SDK siap: ANDROID_HOME=$SDK_ROOT | NDK_HOME=$NDK_DIR | $PLATFORM_PKG | $BUILD_TOOLS_PKG"

      - name: Siapkan Toolchain Rust & Target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Siapkan Cargo.lock untuk Cache Rust
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi

      - name: Cache Kompilasi Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Inisialisasi Proyek Android Tauri v2
        run: npx tauri android init --ci

      - name: Patch AndroidManifest.xml (Cleartext LAN & Izin Wi-Fi)
        run: node scripts/patch-android-manifest.mjs

      - name: Build Debug APK (Siap Pasang)
        run: npx tauri android build --apk --debug --ci -vv

      - name: Kumpulkan Debug APK
        run: |
          mkdir -p artifacts
          DEBUG_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*universal*debug*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            DEBUG_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          cp "$DEBUG_APK" artifacts/LokaKirim-debug.apk
          ls -lh artifacts/

      - name: Build Release APK (Opsional jika Keystore Secrets Tersedia)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Keystore secrets tidak diatur; melewati Release APK (Debug APK tetap dirilis)."
            exit 0
          fi
          npx tauri android build --apk --ci -vv
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*universal*release*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          fi
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/lokakirim-release.keystore
          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$UNSIGNED_APK" /tmp/lokakirim-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/lokakirim-release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out artifacts/LokaKirim-release.apk \
            /tmp/lokakirim-aligned.apk
          rm -f /tmp/lokakirim-release.keystore /tmp/lokakirim-aligned.apk

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: LokaKirim-Android-APK
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Tentukan Tag Rilis Otomatis
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Terbitkan GitHub Release Otomatis dengan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: LokaKirim ${{ steps.release_meta.outputs.tag }}
          files: artifacts/*.apk
          generate_release_notes: true
          make_latest: true
