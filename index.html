<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <meta name="theme-color" content="#202C33" />
    <title>LokaKirim — Chat & Berbagi File Wi-Fi Lokal Terenkripsi</title>
    <meta
      name="description"
      content="Aplikasi chat dan berbagi file cepat jaringan Wi-Fi lokal tanpa internet dengan enkripsi End-to-End (E2EE), transfer chunk file besar, dan indikator kestabilan jaringan real-time."
    />
    <meta property="og:title" content="LokaKirim — Chat & Berbagi File Wi-Fi Lokal Terenkripsi" />
    <meta
      property="og:description"
      content="Aplikasi chat dan berbagi file cepat jaringan Wi-Fi lokal tanpa internet dengan enkripsi End-to-End (E2EE), transfer chunk file besar, dan indikator kestabilan jaringan real-time."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lokakirim_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#EFEAE2] text-slate-900 dark:bg-[#0B141A] dark:text-[#E9EDEF] antialiased selection:bg-[#00A884]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
